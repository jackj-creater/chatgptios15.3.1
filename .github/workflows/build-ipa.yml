name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app without signing
        run: |
          xcodebuild \
            -project ChatGPTLite.xcodeproj \
            -scheme ChatGPTLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          test -d build/DerivedData/Build/Products/Release-iphoneos/ChatGPTLite.app
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ChatGPTLite.app build/Payload/
          cd build
          /usr/bin/zip -qry ChatGPTLite-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTLite-unsigned-IPA
          path: build/ChatGPTLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
